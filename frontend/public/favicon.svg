<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GemQuest">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#123a5c"/>
    </linearGradient>
    <linearGradient id="rim" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#rim)" stroke-width="1.2" opacity="0.55"/>

  <g filter="url(#glow)" transform="translate(32 33)">
    <polygon points="0,-20 16,-6 16,10 0,24 -16,10 -16,-6" fill="#1d4ed8"/>
    <polygon points="0,-20 16,-6 0,2" fill="#38bdf8"/>
    <polygon points="0,-20 -16,-6 0,2" fill="#0ea5e9"/>
    <polygon points="0,2 16,-6 16,10 0,16" fill="#2563eb"/>
    <polygon points="0,2 -16,-6 -16,10 0,16" fill="#1e40af"/>
    <polygon points="0,16 16,10 0,24" fill="#1e3a8a"/>
    <polygon points="0,16 -16,10 0,24" fill="#172554"/>
    <ellipse cx="-6" cy="-9" rx="3.5" ry="5.5" fill="#ffffff" opacity="0.62"/>
    <ellipse cx="5" cy="6" rx="2" ry="3" fill="#bae6fd" opacity="0.35"/>
  </g>

  <circle cx="13" cy="15" r="3.2" fill="#f472b6"/>
  <circle cx="12" cy="14" r="1.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="51" cy="49" r="2.8" fill="#fbbf24"/>
  <circle cx="50" cy="48" r="1" fill="#ffffff" opacity="0.75"/>
</svg>
